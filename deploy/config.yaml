apiVersion: v1
kind: ConfigMap
metadata:
  name: gitops-config
  namespace: gitops-system
data:
  # Your manifest repository (https; see the README for private repos).
  GITOPS_REPO: "https://github.com/<you>/<manifests>.git"
  GITOPS_BRANCH: "main"
  GITOPS_PATH: "manifests"
  # A plain YAML directory or a Kustomize overlay (e.g. k8s/overlays/prod).
  # For an overlay, pin the source so a lost kustomization.yaml fails loudly:
  # GITOPS_SOURCE: "kustomize"
  GITOPS_NAMESPACES: "demo"
  GITOPS_INTERVAL: "30s"
  GITOPS_DRY_RUN: "true"
  GITOPS_PRUNE: "false"
  # Private repo: create the gitops-git Secret, then uncomment:
  # GITOPS_GIT_TOKEN_FILE: "/etc/gitops/git/token"
  # Webhooks: create the gitops-webhook Secret, then uncomment:
  # GITOPS_WEBHOOK_SECRET_FILE: "/etc/gitops/webhook/secret"