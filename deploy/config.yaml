apiVersion: v1
kind: ConfigMap
metadata:
  name: gitops-config
  namespace: gitops-system
data:
  # The public demo repo. Replace it with your own manifest repository.
  GITOPS_REPO: "https://github.com/MateosXhukellari/DemoKubernetes.git"
  GITOPS_BRANCH: "main"
  GITOPS_PATH: "manifests"
  GITOPS_NAMESPACES: "demo"
  GITOPS_INTERVAL: "30s"
  GITOPS_DRY_RUN: "true"
  GITOPS_PRUNE: "false"
  # Private repo: create the gitops-git Secret, then uncomment:
  # GITOPS_GIT_TOKEN_FILE: "/etc/gitops/git/token"
  # Webhooks: create the gitops-webhook Secret, then uncomment:
  # GITOPS_WEBHOOK_SECRET_FILE: "/etc/gitops/webhook/secret"